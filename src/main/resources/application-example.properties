# ?????????????????????????????????????????????????????????????????
# EXAMPLE CONFIGURATION FILE
# Copy this file to application-local.properties
# Fill in your own values
# Never commit application-local.properties to Git
# ?????????????????????????????????????????????????????????????????

# ??? Database configuration ??????????????????????????????????????
DB_URL=jdbc:mysql://localhost:3306/booking_system
DB_USERNAME=your_mysql_username
DB_PASSWORD=your_mysql_password

# ??? Mail (required for email notifications) ?????????????????????
# Create a Gmail account for the app
# Enable 2-Step Verification on that account
# Generate an App Password: Google Account ? Security ? App Passwords
MAIL_USERNAME=your-app-email@gmail.com
MAIL_PASSWORD=your-16-character-app-password

# ??? JWT (required for authentication) ???????????????????????????
# Generate a secure secret with: openssl rand -base64 64
JWT_SECRET=your-generated-secret-key-here