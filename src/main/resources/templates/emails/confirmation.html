<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        body { font-family: Arial, sans-serif; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #2c3e50; color: white; padding: 20px; }
        .content { padding: 20px; background-color: #f9f9f9; }
        .detail { margin: 10px 0; }
        .footer { padding: 10px; text-align: center; color: #888; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>Reservation Confirmed</h2>
    </div>
    <div class="content">
        <p>Hello <strong th:text="${username}"></strong>,</p>
        <p>Your reservation has been confirmed. Here are the details:</p>
        <div class="detail">
            <strong>Room:</strong>
            <span th:text="${resourceName}"></span>
        </div>
        <div class="detail">
            <strong>Room:</strong>
            <span th:text="${roomNumber}"></span>
        </div>
        <div class="detail">
            <strong>Location:</strong>
            <span th:text="${location}"></span>
        </div>
        <div class="detail">
            <strong>Start:</strong>
            <span th:text="${startTime}"></span>
        </div>
        <div class="detail">
            <strong>End:</strong>
            <span th:text="${endTime}"></span>
        </div>
    </div>
    <div class="footer">
        <p>Booking System — Conference Room Reservation</p>
    </div>
</div>
</body>
</html>
