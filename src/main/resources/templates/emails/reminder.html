<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #2c3e50; color: white; padding: 20px; border-radius: 5px 5px 0 0; }
        .content { padding: 20px; background-color: #f9f9f9; border: 1px solid #ddd; }
        .detail { margin: 10px 0; padding: 8px; background-color: white; border-left: 4px solid #2c3e50; }
        .label { font-weight: bold; color: #2c3e50; }
        .footer { padding: 15px; text-align: center; color: #888; font-size: 12px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>⏰ Reminder: Upcoming Reservation</h2>
    </div>
    <div class="content">
        <p>Hello <strong th:text="${username}"></strong>,</p>
        <p>This is a reminder that you have an upcoming reservation:</p>

        <div class="detail">
            <span class="label">Room:</span>
            <span th:text="${resourceName}"></span>
        </div>
        <div class="detail">
            <span class="label">Location:</span>
            <span th:text="${location}"></span>
        </div>
        <div class="detail">
            <span class="label">Room Number:</span>
            <span th:text="${roomNumber}"></span>
        </div>
        <div class="detail">
            <span class="label">Start Time:</span>
            <span th:text="${startTime}"></span>
        </div>
        <div class="detail">
            <span class="label">End Time:</span>
            <span th:text="${endTime}"></span>
        </div>

        <p>Please make sure to arrive on time.</p>
    </div>
    <div class="footer">
        <p>Booking System — Conference Room Reservation API</p>
        <p>This is an automated message, please do not reply.</p>
    </div>
</div>
</body>
</html>
