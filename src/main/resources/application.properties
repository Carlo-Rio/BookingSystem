spring.datasource.url=jdbc:mysql://localhost:3306/booking_system
spring.datasource.username=springstudent
spring.datasource.password=springstudent

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# remove the dialect warning
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

# security logging for debugging
logging.level.org.springframework.security=DEBUG
logging.level.org.springdoc=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.io.swagger=DEBUG

server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-binding-errors=always



spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false


springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

booking.reservation.max-duration-hours=2
booking.reservation.min-duration-hours=1