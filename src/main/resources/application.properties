# ??? Database ??????????????????????????????????????????????????
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/booking_system}
spring.datasource.username=${DB_USERNAME:springstudent}
spring.datasource.password=${DB_PASSWORD:springstudent}

# ??? JPA ???????????????????????????????????????????????????????
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ??? Server ????????????????????????????????????????????????????
server.port=8080
server.error.include-stacktrace=on_param
server.error.include-message=always
server.error.include-binding-errors=always

# ??? Thymeleaf ?????????????????????????????????????????????????
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# ??? Swagger ???????????????????????????????????????????????????
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# ??? Booking rules ?????????????????????????????????????????????
booking.reservation.max-duration-hours=2
booking.reservation.min-duration-hours=1
booking.reminder.hours-before=24

# ??? Mail ??????????????????????????????????????????????????????
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# ??? JWT ???????????????????????????????????????????????????????
jwt.secret=${JWT_SECRET:defaultSecretKeyForDevelopmentOnlyDoNotUseInProduction}
jwt.expiration=1800000

# ??? Logging ???????????????????????????????????????????????????
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO