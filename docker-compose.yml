version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: booking_mysql
    environment:
      MYSQL_DATABASE: booking_system
      MYSQL_USER: springstudent
      MYSQL_PASSWORD: springstudent
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build: .
    container_name: booking_app
    ports:
      - "8080:8080"
    environment:
      # Database — points to mysql container
      DB_URL: jdbc:mysql://mysql:3306/booking_system
      DB_USERNAME: springstudent
      DB_PASSWORD: springstudent
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      # JWT — replace with your own secret
      JWT_SECRET: ${JWT_SECRET:-changeThisToASecureRandomStringInProduction}

      # Mail — replace with your own credentials
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}

    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure

volumes:
  mysql_data: